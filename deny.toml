[advisories]
unmaintained = "all"
yanked = "warn"
ignore = [
    # rsa 0.9 and crypto-bigint 0.5 come only through pgp in solidcraft-io, which verifies the
    # OpenPGP signature of a design's provenance record with a public key. Both advisories concern
    # private-key operations (Marvin timing on RSA decryption, constant-time arithmetic on
    # secrets); FieldCraft opens designs and never hands these crates a private key. SolidCraft's
    # own deny.toml ignores both for the same reason. Drop them once pgp moves to rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "rsa via pgp (solidcraft-io) verifies public-key signatures only; no private-key operations" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via pgp (solidcraft-io) is used for public-key verification only; no secret arithmetic" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# SolidCraft (its kernel, the solidcore kernel it vendors, its UI kit and its patched egui-wgpu and
# winit), pinned by rev in Cargo.toml.
allow-git = ["https://github.com/tangency-labs/solidcraft"]

# What FieldCraft may ship: permissive licences only (no copyleft). A crate offering
# a choice (MIT OR LGPL) passes on its permissive option. THIRD-PARTY-LICENSES.txt is generated at
# release time (`cargo xtask licences`); this is the policy every pull request is held to.
[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# SolidCraft's UI kit, its theme and its look are under the SolidCraft Brand and Interface Licence
# (not permissive). FieldCraft links and distributes exactly these three by the written permission
# of SolidCraft's maintainer (requested by jyviko, approved by bherbruck in #872), recorded in
# docs/adr/0001-libraries.md. Each crate's LICENSE is named
# a LicenseRef, allowed for that crate only; it is not in the allow list above, and any other crate
# under that licence fails.
[[licenses.clarify]]
crate = "solidcraft-ui-kit"
expression = "LicenseRef-SolidCraft-Brand"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[[licenses.clarify]]
crate = "solidcraft-theme"
expression = "LicenseRef-SolidCraft-Brand"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[[licenses.clarify]]
crate = "solidcraft-look"
expression = "LicenseRef-SolidCraft-Brand"
license-files = [{ path = "LICENSE", hash = 0x4b91093f }]

[[licenses.exceptions]]
crate = "solidcraft-ui-kit"
allow = ["LicenseRef-SolidCraft-Brand"]

[[licenses.exceptions]]
crate = "solidcraft-theme"
allow = ["LicenseRef-SolidCraft-Brand"]

[[licenses.exceptions]]
crate = "solidcraft-look"
allow = ["LicenseRef-SolidCraft-Brand"]
