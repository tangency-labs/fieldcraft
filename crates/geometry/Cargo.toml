[package]
name = "fieldcraft-geometry"
description = "FieldCraft's geometry boundary: CAD import, measures and tessellation, implemented with SolidCraft's B-rep kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-model = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-doc = { workspace = true }
solidcraft-io = { workspace = true }
thiserror = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
solidcraft-engine = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Build designs from SolidCraft command scripts (`script_design`): the test corpus and tooling.
# Off by default; the library itself only opens designs.
scripts = ["dep:solidcraft-engine"]

[[example]]
# Compiles a SolidCraft recipe into a design (tools/cooling); needs the script interpreter.
name = "compile_recipe"
required-features = ["scripts"]
