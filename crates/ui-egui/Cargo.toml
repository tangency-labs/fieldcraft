[package]
name = "fieldcraft-ui-egui"
description = "FieldCraft desktop interface (egui + wgpu): viewport, model tree, commands, status bar and the control channel's request handling"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-model = { workspace = true }
fieldcraft-engine = { workspace = true }
fieldcraft-render = { workspace = true }
fieldcraft-explicit = { workspace = true }
fieldcraft-geometry = { workspace = true }
fieldcraft-decks = { workspace = true }
# Releases and staged installs, for the update notice (the host does the downloading).
fieldcraft-update = { workspace = true }
egui = { workspace = true }
craft-ui = { workspace = true }
egui-wgpu = { workspace = true }
fieldcraft-gpu = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
resvg = { workspace = true }
png = { workspace = true }

# Browser rendering retains WebGPU/WebGL and its single-threaded JS handles. Do not enable
# egui-wgpu's defaults: they also enable all native wgpu backends.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
