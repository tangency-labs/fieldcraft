[package]
name = "fieldcraft-solver"
description = "FieldCraft's implicit solver: assembly, boundary conditions, sparse Cholesky, linear static and frequency analysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-model = { workspace = true }
fieldcraft-fem = { workspace = true }
fieldcraft-parallel = { workspace = true }
# Use the mesh crate's pure-Rust math convention for the flat-shell geometry checks.
libm = "0.2"
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The validity gate, to prove the solvers and the meshers share one criterion.
fieldcraft-mesh = { workspace = true }
