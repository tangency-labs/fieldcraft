[package]
name = "fieldcraft-gpu"
description = "FieldCraft's GPU viewport pipelines (lit faces, wide lines) and offscreen captures: the window's picture, drawn without a window"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fieldcraft-render = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
# Vulkan is the only native backend, including the desktop viewport and compute solvers.
wgpu = { workspace = true, features = ["vulkan"] }

# wgpu requires a separate opt-in for Vulkan portability implementations on Apple platforms.
[target.'cfg(all(not(target_arch = "wasm32"), target_vendor = "apple"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan-portability"] }
