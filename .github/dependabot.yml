# Weekly dependency updates against develop, the trunk, grouped so each ecosystem opens one pull
# request a week. Security updates are switched on in the repository settings and open their own
# pull requests as advisories appear. CI runs the full gate on Dependabot's pull requests
# (.github/workflows/ci.yml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Compatible updates (Cargo.lock only) in one pull request; a breaking release of a
      # dependency comes on its own, since it usually needs code changes.
      cargo-compatible:
        update-types: [minor, patch]
    ignore:
      # Pinned to the SolidCraft commit FieldCraft builds against, with solidcore-record from the
      # copy of solidcore vendored there and the egui-wgpu patch from SolidCraft
      # ([patch.crates-io] in Cargo.toml); moved by hand.
      - dependency-name: "solidcraft-*"
      - dependency-name: "solidcore*"
      - dependency-name: egui-wgpu
      # The egui line follows SolidCraft's (its egui-wgpu fixes are patched in): patch releases
      # come with the group, a new line (0.36 -> 0.37) moves by hand with SolidCraft.
      - dependency-name: egui
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: eframe
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The shared Craft components follow VectorCraft's rev.
      - dependency-name: craft-ui
      # The native file dialogs follow SolidCraft's version, so both apps build one rfd and share
      # its compiled crates; moved by hand with SolidCraft.
      - dependency-name: rfd
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The exact predicates' BigInt must be num-rational's (0.4 uses num-bigint 0.4): both move
      # together, by hand.
      - dependency-name: num-bigint
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: num-rational
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      # Actions are pinned by commit SHA with a version comment; Dependabot updates both.
      actions:
        patterns: ["*"]
    ignore:
      # The Rust toolchain is one version across FieldCraft, SolidCraft, SolidCore and SurfaceCraft
      # (rust-toolchain.toml and every workflow's dtolnay/rust-toolchain@<version>), moved by hand
      # in all of them together.
      - dependency-name: dtolnay/rust-toolchain
